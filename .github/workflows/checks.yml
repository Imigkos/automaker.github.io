name: Checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned development dependencies
        run: npm ci --ignore-scripts
      - name: Validate source, build and behavior
        run: |
          npm run format:check
          npm run check
          npm run build
          npm test
          git diff --exit-code -- assets/site.css
